{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><span class="eyebrow">CLINIC OPERATIONS</span><h1>Appointments</h1><p class="muted">Find the right visit, with a little less searching.</p></div></div><section class="panel"><form method="get" class="filter-grid"><label>Search<input name="q" value="{{ request.GET.q }}" placeholder="Patient, doctor, or reason"></label><label>Doctor<select name="doctor"><option value="">All doctors</option>{% for doctor in doctors %}<option value="{{ doctor.pk }}" {% if request.GET.doctor == doctor.pk|stringformat:'s' %}selected{% endif %}>{{ doctor }}</option>{% endfor %}</select></label><label>Patient<select name="patient"><option value="">All patients</option>{% for patient in patients %}<option value="{{ patient.pk }}" {% if request.GET.patient == patient.pk|stringformat:'s' %}selected{% endif %}>{{ patient }}</option>{% endfor %}</select></label><label>Date<input type="date" name="date" value="{{ request.GET.date }}"></label><label>Status<select name="status"><option value="">All statuses</option><option value="confirmed" {% if request.GET.status == 'confirmed' %}selected{% endif %}>Confirmed</option><option value="cancelled" {% if request.GET.status == 'cancelled' %}selected{% endif %}>Cancelled</option></select></label><button class="button">Apply filters</button><a href="{% url 'platform-appointments' %}" class="text-link">Reset</a></form>{% include 'partials/appointments.html' %}</section>{% endblock %}
