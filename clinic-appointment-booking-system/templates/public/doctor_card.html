<article class="doctor-card"><a class="portrait portrait-{{ forloop.counter|default:1 }}" href="{% url 'doctor-detail' doctor.pk %}" aria-label="View {{ doctor }}"><span class="portrait-initials">{{ doctor.user.first_name|slice:':1' }}{{ doctor.user.last_name|slice:':1' }}</span><span class="portrait-cross">✚</span><small>{% if doctor.is_available %}Accepting appointments{% else %}Currently unavailable{% endif %}</small></a><div class="doctor-card-body"><span class="eyebrow">{{ doctor.specialty }}</span><h3>{{ doctor }}</h3><p>{{ doctor.biography|truncatewords:14 }}</p><a class="text-link" href="{% url 'doctor-detail' doctor.pk %}">View profile & availability →</a></div></article>
