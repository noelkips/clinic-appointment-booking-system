# Blueprint path: clinic-appointment-booking-system/render.yaml (from Git root).
services:
  - type: web
    name: savannah-clinic
    runtime: python
    plan: free
    branch: main
    rootDir: clinic-appointment-booking-system
    autoDeployTrigger: checksPass
    buildCommand: bash scripts/render-build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile - --error-logfile -
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: DATABASE_URL
        fromDatabase:
          name: savannah-postgres
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: 'False'
      - key: DJANGO_TRUST_PROXY
        value: 'True'
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: DEMO_SEED_ENABLED
        value: 'False'
      - key: DJANGO_ALLOW_SQLITE
        value: 'False'
databases:
  - name: savannah-postgres
    plan: free
    postgresMajorVersion: '18'
    ipAllowList: []
