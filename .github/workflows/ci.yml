name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: PostgreSQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clinic-appointment-booking-system
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: clinic_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: clinic_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clinic_ci -d clinic_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret-keep-this-value-out-of-production
      DJANGO_DEBUG: 'True'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgresql://clinic_ci:ephemeral-ci-only@127.0.0.1:5432/clinic_ci
      DEMO_SEED_ENABLED: 'False'
      DJANGO_ALLOW_SQLITE: 'False'
      PGPASSWORD: ephemeral-ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.12'
          cache: pip
          cache-dependency-path: clinic-appointment-booking-system/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependencies
        run: python -m pip check
      - name: Enable PostgreSQL extension
        run: psql -h 127.0.0.1 -U clinic_ci -d clinic_ci -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS btree_gist;'
      - name: Django checks and migration consistency
        run: |
          python manage.py check --database default
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py migrate --check
      - name: Complete PostgreSQL suite (including concurrency)
        run: python manage.py test --settings=config.test_settings --noinput --verbosity 2
      - name: Production checks and static build
        env:
          DJANGO_DEBUG: 'False'
          DJANGO_TRUST_PROXY: 'True'
        run: |
          python manage.py check --deploy --fail-level WARNING
          python manage.py collectstatic --noinput --ignore=src
          python -c "from config.wsgi import application; assert callable(application)"
